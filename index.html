    function moviesPage(){const q=route().query.get('q')||'',genre=route().query.get('genre')||'All genres',sort=route().query.get('sort')||'Popular',genres=['All genres',...new Set(state.movies.flatMap(m=>m.tags||[]))],filtered=state.movies.filter(m=>`${m.title} ${m.genre} ${m.language} ${m.director} ${(m.cast||[]).flat()}`.toLowerCase().includes(q.toLowerCase())&&(genre==='All genres'||m.tags?.includes(genre))).sort((a,b)=>sort==='Rating'?b.rating-a.rating:sort==='A-Z'?a.title.localeCompare(b.title):0);return `<div class="container content"><div class="page-intro"><div><div class="kicker">The full picture</div><h1>Discover <em>your next film.</em></h1><p>Stories for every mood, in every format.</p></div><div class="stat"><strong>${filtered.length}</strong><span>films in your<br>selection</span></div></div><form class="filters" id="movie-filter"><label class="search">⌕<input name="q" value="${esc(q)}" placeholder="Search by title, actor, director..."></label><select name="genre">${genres.map(g=>`<option ${g===genre?'selected':''}>${esc(g)}</option>`).join('')}</select><select name="sort"><option ${sort==='Popular'?'selected':''}>Popular</option><option ${sort==='Rating'?'selected':''}>Rating</option><option ${sort==='A-Z'?'selected':''}>A-Z</option></select></form>${filtered.length?`<div class="grid movies-grid">${filtered.map(movieCard).join('')}</div>`:`<div class="empty"><h3>No films found</h3><p>Try a different title, actor, or genre.</p></div>`}</div>`}

    function draftFromQuery(){const q=route().query;state.draft=state.draft||{movieId:q.get('movie')||state.movies[0].id,theatreId:q.get('theatre')||state.theatres[0].id,date:'Today · Sep 28',time:q.get('time')||'7:30 PM',seats:[],customer:{name:state.user?.name||'',email:state.user?.email||'',phone:''},payment:'UPI'};if(q.get('movie'))state.draft.movieId=q.get('movie');if(q.get('theatre'))state.draft.theatreId=q.get('theatre');if(q.get('time'))state.draft.time=q.get('time');save();return state.draft}
    function booking(step){const d=draftFromQuery(),m=movie(d.movieId),t=theatre(d.theatreId),steps=['theatre','date','show','seats','details','payment'],current=step||'theatre',index=steps.indexOf(current),ticket=d.seats.reduce((a,s)=>a+s.price,0),fee=d.seats.length?Math.round(ticket*.08):0,tax=Math.round((ticket+fee)*.05),total=ticket+fee+tax;const summary=`<aside class="summary"><div class="summary-label">Your ticket</div><div class="summary-movie"><img src="${m.poster}" alt=""><div><strong>${esc(m.title)}</strong><span>${esc(m.genre)}</span></div></div><div class="summary-details"><div><span>Theatre</span><strong>${esc(t.name)}</strong></div><div><span>Date & time</span><strong>${esc(d.date)}<br>${esc(d.time)}</strong></div><div><span>Seats</span><strong>${d.seats.length?d.seats.map(s=>s.id).join(', '):'Not selected'}</strong></div></div><div class="price"><div class="price-line"><span>Tickets</span><strong>${money(ticket)}</strong></div><div class="price-line"><span>Convenience fee</span><strong>${money(fee)}</strong></div><div class="price-line"><span>Taxes</span><strong>${money(tax)}</strong></div><div class="price-line total"><span>Total</span><strong>${money(total)}</strong></div></div></aside>`;let content='';if(current==='theatre')content=`<div class="booking-section"><div class="kicker">Step in your story</div><h2>Where are you watching?</h2><p>Choose a theatre close to you.</p><div class="choice-list">${state.theatres.map(x=>`<button class="choice" data-action="choose-theatre" data-id="${x.id}"><span class="choice-art" style="background:${x.gradient}">⌂</span><span class="choice-copy"><strong>${esc(x.name)}</strong><span>${esc(x.location)}</span><small>★ ${x.rating} · ${x.distance} · ${x.formats.join(' · ')}</small></span><b>→</b></button>`).join('')}</div></div>`;if(current==='date')content=`<div class="booking-section"><button class="back" data-action="back-booking">← Back</button><div class="kicker">Step in your story</div><h2>When are you going?</h2 Optional"></textarea></label><button class="btn primary">Continue to payment →</button></form></div>`;if(current==='payment')content=`<div class="booking-section"><button class="back" data-action="back-booking">← Back</button><div class="kicker">Step in your story</div><h2>Almost there.</h2><p>This is a safe demo checkout. No real money is charged.</p><div class="pay-methods">${['UPI','Card','Net banking','Wallet'].map(x=>`<button class="${d.payment===x?'active':''}" data-action="pay-method" data-method="${x}">${x}</button>`).join('')}</div><form class="form" id="payment-form">${d.payment==='UPI'?'<label>UPI ID<input required placeholder="name@upi"></label>':d.payment==='Card'?'<label>Card number<input required placeholder="1234 5678 9012 3456"></label>':`<label>Choose ${d.payment}<select><option>HDFC Bank</option><option>Paytm</option><option>PhonePe</option></select></label>`}<div class="demo">⌁ Demo checkout · You will not be charged</div><button class="btn primary" id="pay-now">Pay ${money(total)} securely →</button></form></div>`;return `<div class="container booking"><div class="booking-head"><div><div class="kicker">Your night, your way</div><h1 class="booking-title">Book your <em>experience.</em></h1></div><div class="secure">Booking in progress<br><span>Secure demo checkout</span></div></div><div class="stepper">${steps.map((x,i)=>`<div class="step ${i<=index?'active':''}"><i>${i+1}</i><small>${x}</small></div>`).join('')}</div><div class="booking-layout"><div>${content}</div>${summary}</div></div>`}
    function seatPage(d,m){const booked=['A4','A5','B7','C2','C3','D8','E1','F6','F7'];return `<div class="booking-section"><button class="back" data-action="back-booking">← Back</button><div class="kicker">Step in your story</div><h2>Pick your seats.</h2><p>Good seats make good stories. Select up to 6.</p><div class="legend"><span><i class="seat available"></i>Available</span><span><i class="seat premium"></i>Premium</span><span><i class="seat selected"></i>Selected</span><span><i class="seat booked"></i>Booked</span></div><div class="screen">SCREEN</div><div class="seat-map">${['A','B','C','D','E','F'].map(row=>`<div class="seat-row"><small>${row}</small><div class="seat-block">${[1,2,3,4,5].map(n=>seatButton(`${row}${n}`,d,seated(booked))).join('')}</div><div class="seat-block">${[6,7,8,9,10].map(n=>seatButton(`${row}${n}`,d,seated(booked))).join('')}</div><small>${row}</small></div>`).join('')}</div><div class="seat-summary"><strong>${d.seats.length?d.seats.map(s=>s.id).join(', '):'Select a seat'}</strong><span>${d.seats.length} of 6 seats selected</span><button class="btn primary" data-action="continue-seats" ${d.seats.length?'':'disabled'}>Continue →</button></div></div>`}

    function ticketHTML(x,m,t){const qrText=`${x.id}|${m.title}|${t.name}|${x.date}|${x.time}|${x.seats.map(s=>s.id).join(',')}`;return `<div class="ticket" data-qr="${esc(qrText)}"><div class="ticket-main"><div class="ticket-top"><span class="brand ticket-brand"><span class="brand-mark">Q</span><span>QUICK<span>SHOW</span></span></span><span class="ticket-status">● CONFIRMED</span></div><div class="ticket-movie"><img src="${m.poster}" alt=""><div><div class="kicker">Movie ticket</div><h2>${esc(m.title)}</h2><p>${esc(m.genre)} · ${m.language}</p></div></div><div class="ticket-grid"><div><span>At</span><strong>${esc(t.name)}</strong></div><div><span>When</span><strong>${esc(x.date)}<br>${esc(x.time)}</strong></div><div><span>Seats</span><strong>${x.seats.map(s=>s.id).join(', ')}</strong></div><div><span>Booking ID</span><strong>${x.id}</strong></div></div></div><div class="ticket-stub"><i class="notch top"></i><div id="qrcode"></div><span>Scan at entry</span><strong>${money(x.total)}</strong><i class="notch bottom"></i></div></div>`}
    function bookings(){const tab=route().query.get('tab')||'UPCOMING',list=state.bookings.filter(b=>b.status===tab);return `<div class="container content"><div class="page-intro"><div><div class="kicker">Your cinema history</div><h1>My <em>bookings.</em></h1><p>Every story you chose to be part of.</p></div><a class="btn primary" href="#/movies">Book a new show ↗</a></div><div class="tabs">${['UPCOMING','COMPLETED','CANCELLED'].map(x=>`<button class="${tab===x?'active':''}" data-action="tab" data-tab="${x}">${x[0]+x.slice(1).toLowerCase()} <span>${state.bookings.filter(b=>b.status===x).length}</span></button>`).join('')}</div>${list.length?list.map(x=>{const m=movie(x.movieId),t=theatre(x.theatreId);return `<div class="booking-card"><img src="${m.poster}" alt=""><div class="booking-card-body"><div class="booking-card-head"><div><h3>${esc(m.title)}</h3><span>${esc(t.name)} · ${esc(x.date)}</span></div><b class="status ${x.status.toLowerCase()}">${x.status}</b></div><div class="booking-data"><div><small>Showtime</small>${esc(x.time)}</div><div><small>Seats</small>${x.seats.map(s=>s.id).join(', ')}</div><div><small>Booking ID</small>${x.id}</div><div><small>Amount</small>${money(x.total)}</div></div><a class="text-link" href="#/ticket/${x.id}">View ticket ↗</a>${x.status==='UPCOMING'?` <button class="back" data-action="cancel" data-id="${x.id}" style="margin-left:20px;color:#ef899d">Cancel booking</button>`:''}</div></div>`}).join(''):`<div class="empty"><h3>No ${tab.toLowerCase()} bookings</h3><p>${tab==='UPCOMING'?'Your next great night out is one click away.':'Your booking history will appear here.'}</p><a class="btn primary" href="#/movies">Browse movies →</a></div>`}</div>`}
    function auth(register=false){return `<div class="auth"><div class="auth-art"><div class="brand"><span class="brand-mark">Q</span><span>QUICK<span>SHOW</span></span></div><div><h1>Leave the ordinary<br><em>at the door.</em></h1><p>Book a better night out.</p></div><span class="kicker">A new story starts here.</span></div><div class="auth-panel"><div class="auth-form"><div class="kicker">${register?'Join the audience':'Welcome back'}</div><h2>${register?'Create your account.':'Good to see you.'}</h2><p>${register?'Your next great night out is waiting.':'Pick up where your last story left off.'}</p><form class="form" id="${register?'register':'login'}-form">${register?'<label>Full name<input name="name" required placeholder="What should we call you?"></label>':''}<label>Email address<input name="email" type="email" required placeholder="you@example.com"></label><label>Password<input name="password" type="password" required placeholder="••••••••"></label>${register?'<label>Confirm password<input name="confirm" type="password" required placeholder="••••••••"></label>':''}<button class="btn primary">${register?'Create account':'Log in'} →</button></form><div class="switch">${register?'Already a member?':'New to QuickShow?'} <a href="#/${register?'login':'register'}">${register?'Log in':'Create an account'}</a></div></div></div></div>`}
    function profile(){const b=state.bookings;return `<div class="container content"><div class="profile-head"><div class="profile-avatar">${initials(state.user?.name)}</div><div><div class="kicker">Your QuickShow identity</div><h1>Welcome, <em>${esc((state.user?.name||'Guest').split(' ')[0])}.</em></h1><p>${esc(state.user?.email||'')}</p></div><button class="btn ghost" data-action="edit-profile">Edit profile</button></div><div class="profile-grid"><section class="profile-box"><h3>Personal details</h3><form class="form" id="profile-form"><label>Full name<input name="name" value="${esc(state.user?.name||'')}"></label><label>Email<input value="${esc(state.user?.email||'')}" disabled></label><label>Phone<input name="phone" value="${esc(state.user?.phone||'')}" placeholder="Add your mobile number"></label><button class="btn primary">Save changes</button></form></section><section class="profile-box"><h3>Your numbers</h3><div class="numbers-grid"><div><strong>${b.length}</strong><span>Total bookings</span></div><div><strong>${b.filter(x=>x.status==='UPCOMING').length}</strong><span>Upcoming</span></div><div><strong>${b.filter(x=>x.status==='COMPLETED').length}</strong><span>Completed</span></div></div></section></div></div>`}
    function settings(){return `<div class="container content"><div class="page-intro"><div><div class="kicker">Make it yours</div><h1>Your <em>settings.</em></h1></div></div><div class="settings"><div class="setting-group"><h3>Appearance</h3><div class="setting-row"><div><strong>Dark mode</strong><span>Easy on the eyes, day or night.</span></div><button class="toggle ${state.settings.dark?'on':''}" data-action="toggle" data-key="dark"><i></i></button></div></div><div class="setting-group"><h3>Notifications</h3><div class="setting-row"><div><strong>Show reminders</strong><span>Get a nudge before your show starts.</span></div><button class="toggle ${state.settings.reminders?'on':''}" data-action="toggle" data-key="reminders"><i></i></button></div></div><div class="setting-group"><h3>Your city</h3><div class="setting-row"><div><strong>Preferred location</strong><span>We'll show venues close to you.</span></div><select id="settings-location"><option>Chennai</option><option>Coimbatore</option><option>Madurai</option><option>Trichy</option><option>Salem</option></select></div></div><div class="setting-group"><button class="back" data-action="logout" style="color:#ef899d">Log out of QuickShow →</button></div></div></div>`}
    function admin(){return `<div class="container content"><div class="page-intro"><div><div class="kicker">QuickShow control room</div><h1>Good morning, <em>admin.</em></h1><p>Manage your demo cinema universe.</p></div><span class="status upcoming">ADMIN MODE</span></div><div class="admin-stats"><div class="admin-stat"><b>↗</b><strong>${state.movies.length}</strong><small>Movies</small></div><div class="admin-stat"><b>⌂</b><strong>${state.theatres.length}</strong><small>Theatres</small></div><div class="admin-stat"><b>◷</b><strong>84</strong><small>Shows</small></div><div class="admin-stat"><b>◫</b><strong>${state.bookings.length}</strong><small>Bookings</small></div><div class="admin-stat"><b>₹</b><strong>${money(state.bookings.reduce((a,b)=>a+b.total,0))}</strong><small>Revenue</small></div></div><div class="admin-columns"><section class="admin-box"><h3>Manage movies</h3><button class="btn primary" data-action="add-movie" style="margin:18px 0">Add movie +</button>${state.movies.slice(0,8).map(m=>`<div class="admin-row"><div><strong>${esc(m.title)}</strong><small>${esc(m.genre)}</small></div><button class="back" data-action="delete-movie" data-id="${m.id}">Delete</button></div>`).join('')}</section><section class="admin-box"><h3>Quick actions</h3><a class="admin-action" href="#/theatres">Manage theatres <b>→</b></a><a class="admin-action" href="#/bookings">Review bookings <b>→</b></a><button class="admin-action" data-action="reset-demo">Reset demo data <b>↻</b></button></section></div></div>`}
    function render(){const r=route();let body='';if(r.page==='home')body=home();else if(r.page==='movies')body=moviesPage();else if(r.page==='movie')body=movieDetails(movie(r.id));else if(r.page==='theatres')body=theatresPage();else if(r.page==='theatre')body=theatreDetails(theatre(r.id));else if(r.page==='booking'){body=booking(r.id||'theatre')}else if(r.page==='success'){const x=state.bookings.find(b=>b.id===r.id);body=x?success(x):notFound()}else if(r.page==='bookings')body=bookings();else if(r.page==='ticket'){const x=state.bookings.find(b=>b.id===r.id);body=x?`<div class="container content"><a class="back" href="#/bookings">← My bookings</a>${ticketHTML(x,movie(x.movieId),theatre(x.theatreId))}<div class="actions" style="justify-content:center"><button class="btn primary" data-action="print">Print ticket</button><button class="btn ghost" data-action="download" data-id="${x.id}">Download</button>${x.status==='UPCOMING'?`<button class="btn danger" data-action="cancel" data-id="${x.id}">Cancel</button>`:''}</div></div>`:notFound()}else if(r.page==='profile')body=state.user?profile():auth();else if(r.page==='settings')body=settings();else if(r.page==='login')body=auth(false);else if(r.page==='register')body=auth(true);else if(r.page==='admin')body=state.user?.role==='admin'?admin():auth();else body=notFound();document.getElementById('app').innerHTML=nav()+body+(r.page==='login'||r.page==='register'||r.page==='admin'&&!state.user?'':footer());document.getElementById('location').value=state.location;document.querySelectorAll('[data-nav]').forEach(x=>x.classList.toggle('active',x.dataset.nav===r.page));if(r.page==='settings')document.getElementById('settings-location').value=state.location;if(r.page==='success'||r.page==='ticket')makeQR();window.scrollTo(0,0)}
    function notFound(){return `<div class="container not-found"><b>404</b><h1>This scene <em>doesn't exist.</em></h1><p>Looks like this page got cut from the final edit.</p><a class="btn primary" href="#/home">Back to home →</a></div>`}
    function makeQR(){const el=document.getElementById('qrcode');if(!el)return;const ticket=el.closest('.ticket')?.dataset.qr;if(window.QRCode&&ticket)new QRCode(el,{text:ticket,width:100,height:100,colorDark:'#15171b',colorLight:'#fff'});else el.innerHTML='<div class="fake-qr"></div>'}
    function openModal(html){const wrap=document.createElement('div');wrap.className='modal-wrap';wrap.innerHTML=`<div class="modal"><div class="modal-head"><span class="kicker">QuickShow</span><button data-action="close-modal">×</button></div>${html}</div>`;document.body.appendChild(wrap)}
    function completeBooking(){const d=state.draft,m=movie(d.movieId),t=theatre(d.theatreId),ticket=d.seats.reduce((a,s)=>a+s.price,0),fee=Math.round(ticket*.08),tax=Math.round((ticket+fee)*.05),x={id:'QS-2026-'+Math.floor(100000+Math.random()*899999),movieId:d.movieId,theatreId:d.theatreId,date:d.date,time:d.time,seats:d.seats,total:ticket+fee+tax,status:'UPCOMING',customer:d.customer,createdAt:new Date().toISOString()};state.bookings.unshift(x);state.notifications++;save();go('success',x.id);toast('Payment successful ✓')}
    document.addEventListener('click',e=>{const a=e.target.closest('[data-action]');if(!a)return;const action=a.dataset.action;if(action==='menu')document.getElementById('navlinks').classList.toggle('open');if(action==='search')openModal(`<form class="form" id="global-search"><label>Search movies, theatres, actors or genres<input name="q" autofocus placeholder="Try “sci-fi” or “Tamil”"></label><button class="btn primary">Search →</button></form>`);if(action==='notifications')openModal(`<h2>Notifications</h2><p style="color:var(--muted);margin-top:10px">${state.notifications?'You have '+state.notifications+' unread updates.':'No new notifications.'}</p><button class="btn ghost" data-action="read-notifications" style="margin-top:20px">Mark as read</button>`);if(action==='close-modal')a.closest('.modal-wrap').remove();if(action==='trailer'){const m=movie(a.dataset.id);openModal(`<div class="trailer" style="background-image:url(${m.backdrop})"><button class="play">▶</button></div><h2 style="margin-top:18px">${esc(m.title)} · Trailer preview</h2>`)}if(action==='choose-theatre'){draftFromQuery().theatreId=a.dataset.id;save();go('booking','date')}if(action==='choose-date'){state.draft.date=a.dataset.date==='TODAY'?'Today · Sep 28':a.dataset.date+' · Oct 2026';save();go('booking','show')}if(action==='choose-show'){state.draft.time=a.dataset.time;save();go('booking','seats')}if(action==='seat'){const d=state.draft,id=a.dataset.seat,price=['A','B'].includes(id[0])?250:180,has=d.seats.some(x=>x.id===id);if(!has&&d.seats.length>=6)return toast('Maximum 6 seats');d.seats=has?d.seats.filter(x=>x.id!==id):[...d.seats,{id,type:price===250?'Premium':'Standard',price}];save();render()}if(action==='continue-seats'){go('booking','details')}if(action==='back-booking'){const s=route().id||'theatre',order=['theatre','date','show','seats','details','payment'],i=order.indexOf(s);go('booking',order[Math.max(0,i-1)])}if(action==='pay-method'){state.draft.payment=a.dataset.method;save();render()}if(action==='print')window.print();if(action==='cancel'){if(confirm('Cancel this booking?')){const x=state.bookings.find(b=>b.id===a.dataset.id);if(x){x.status='CANCELLED';save();toast('Booking cancelled ✓');render()}}}if(action==='tab')go('bookings','',{tab:a.dataset.tab});if(action==='toggle'){state.settings[a.dataset.key]=!state.settings[a.dataset.key];save();render()}if(action==='logout'){state.user=null;save();go('home')}if(action==='read-notifications'){state.notifications=0;save();a.closest('.modal-wrap').remove();render()}if(action==='add-movie'){const title=prompt('Movie title');if(title){state.movies.push({id:'custom-'+Date.now(),title,genre:'New release',language:'English',duration:'2h',rating:7.5,release:'Coming soon',cert:'U',format:'2D',poster:moviesSeed[0].poster,backdrop:moviesSeed[0].backdrop,description:'A new QuickShow demo movie.',director:'QuickShow Studio',cast:[],tags:['New'],coming:true});save();toast('Movie added ✓');render()}}if(action==='delete-movie'){if(confirm('Delete this movie from demo data?')){state.movies=state.movies.filter(m=>m.id!==a.dataset.id);save();render()}}if(action==='reset-demo'){if(confirm('Reset local demo data?')){localStorage.clear();location.reload()}}if(action==='download'){const x=state.bookings.find(b=>b.id===a.dataset.id);if(x){const m=movie(x.movieId),t=theatre(x.theatreId),html=`<!doctype html><title>${x.id} — QuickShow Ticket</title><style>body{font:16px Arial;padding:40px}h1{color:#d64e70}p{margin:10px 0}</style><h1>QUICKSHOW</h1><h2>${m.title}</h2><p>Theatre: ${t.name}</p><p>Date: ${x.date} · ${x.time}</p><p>Seats: ${x.seats.map(s=>s.id).join(', ')}</p><p>Booking ID: ${x.id}</p><p>Amount: ₹${x.total}</p>`;const blob=new Blob([html],{type:'text/html'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download=`quickshow-${x.id}.html`;link.click();URL.revokeObjectURL(url)}}});
    document.addEventListener('submit',e=>{if(e.target.id==='movie-filter'){e.preventDefault();const d=new FormData(e.target);go('movies','',{q:d.get('q'),genre:d.get('genre'),sort:d.get('sort')})}if(e.target.id==='global-search'){e.preventDefault();const q=new FormData(e.target).get('q');document.querySelector('.modal-wrap')?.remove();go('movies','',{q})}if(e.target.id==='details-form'){e.preventDefault();const d=Object.fromEntries(new FormData(e.target));state.draft.customer=d;save();go('booking','payment')}if(e.target.id==='payment-form'){e.preventDefault();const btn=e.target.querySelector('#pay-now');btn.disabled=true;btn.textContent='Processing payment…';setTimeout(completeBooking,900)}if(e.target.id==='login-form'||e.target.id==='register-form'){e.preventDefault();const d=Object.fromEntries(new FormData(e.target));if(e.target.id==='register-form'&&d.password!==d.confirm)return toast('Passwords do not match');let user=state.users.find(x=>x.email.toLowerCase()===d.email.toLowerCase()&&x.password===d.password);if(e.target.id==='register-form'){user={name:d.name,email:d.email,phone:'',password:d.password,role:'user'};state.users.push(user)}if(!user)return toast('Invalid login');state.user={name:user.name,email:user.email,phone:user.phone,role:user.role};save();go('home');toast('Login successful ✓')}if(e.target.id==='profile-form'){e.preventDefault();const d=Object.fromEntries(new FormData(e.target));state.user={...state.user,...d};save();toast('Profile updated ✓');render()}});
    document.getElementById('app').addEventListener('change',e=>{if(e.target.id==='location'||e.target.id==='settings-location'){state.location=e.target.value;save();render()}});
    window.addEventListener('hashchange',render);window.addEventListener('load',render);
  </script>
</body>
</html>
